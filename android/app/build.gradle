plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing credentials, kept out of the repo (see android/README.md).
// Absent on a fresh clone, in which case only debug builds are possible.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.alekweather.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.alekweather.app"
        minSdk 26
        targetSdk 34
        // versionCode must increase on every published build; versionName is
        // the human one, kept in step with ANDROID_VERSION in
        // src/utils/version.js, which Settings displays inside the APK.
        versionCode 9
        versionName "0.9"

        // The app ships one string of its own (app_name) and a web UI that is
        // English throughout. Everything else in resources.arsc is appcompat and
        // WorkManager shipping their own strings in ~85 languages -- "Navigate
        // up", notification-channel names and the like -- none of which the page
        // ever surfaces. Keeping only 'en' drops all of them.
        resourceConfigurations += ['en']
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Falls back to unsigned if keystore.properties is missing, rather
            // than silently producing a debug-signed "release".
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : null
            // Shrinking is on for the libraries, not for this app's Kotlin. The dex
            // was 78% of the APK and almost all of it is androidx -- appcompat, webkit
            // and work-runtime, very little of which a single activity reaches.
            // The WebView bridges are the one thing R8 must not touch; all three are
            // pinned by name in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // DayNight theme, so the WebView reports prefers-color-scheme correctly
    // to the app's "system" theme setting.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // WebViewAssetLoader: serves the bundled build over a real https origin
    // instead of file://, which the CSP and the service worker both require.
    implementation 'androidx.webkit:webkit:1.10.0'
    // WorkManager runs the hourly weather check (WeatherCheckWorker) with the
    // app closed, and persists that schedule across reboots and app updates.
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
