<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f2f5" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The Google Fonts stylesheet is added from main.jsx, not linked here: a
         <link rel="stylesheet"> in the head blocks first paint on a round trip
         to fonts.googleapis.com, which on a cold phone radio is seconds. -->
    <title>Alek Weather</title>
    <!-- Boot screen (phone only): inline so the very first paint, before the
         JS bundle and App.css arrive, is already the loading screen. Colours
         follow the OS scheme; main.jsx applies a saved Theme choice and removes
         it on desktop; App.jsx fades it out once the app is ready. The sky
         behind it is the one the app will open on: boot-sky.js, below. -->
    <style>
      #boot {
        --boot-bg: #f0f2f5; --boot-text: #1a1a2e;
        position: fixed; inset: 0; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--boot-bg); color: var(--boot-text);
        font-family: 'Google Sans', 'Product Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 0.45s;
        /* Its own compositor layer from the first frame, so starting the fade
           doesn't have to create (and paint) one on the spot. */
        will-change: opacity;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #boot { --boot-bg: #000000; --boot-text: #e6edf3; }
      }
      :root[data-theme="dark"] #boot { --boot-bg: #000000; --boot-text: #e6edf3; }
      /* The forecast's sky, when the app will open on one: boot-sky.js sets
         --boot-sky (the gradient App last drew) and data-boot-sky before the
         first paint, and App corrects it if the launch lands on another. Same
         full-screen box as the app's .sky-bg, so the gradient lines up exactly
         and the reveal changes what is on the sky, not the sky. Text goes white
         over it, as the app's does. */
      /* !important only to get past the app's startup guard (data-booting in
         index.css switches every transition off with !important), which is
         still on when App first sets the sky: without it a sky arriving then
         would snap in instead of fading. */
      #boot::before {
        content: ''; position: absolute; inset: 0; z-index: -1;
        background: var(--boot-sky, none);
        opacity: 0; transition: opacity 0.4s ease !important;
      }
      :root[data-boot-sky] #boot::before { opacity: 1; }
      :root[data-boot-sky] #boot { --boot-text: #ffffff; }
      :root[data-boot-sky] #boot .boot-name { text-shadow: 0 1px 10px rgba(0, 0, 0, 0.28); }
      /* Desktops (fine pointer that can hover) never show it. */
      @media (hover: hover) and (pointer: fine) { #boot { display: none; } }
      /* A step before the fade (App.jsx). While the screen is fully opaque the
         browser skips drawing the app hidden under it, so the first frames of
         the fade used to have to draw the whole forecast, glass blur and all,
         at once: the hitch at the start of the reveal. A hair under opaque
         (invisibly so) has it draw the app beneath ahead of time, and the fade
         then only blends finished layers. */
      #boot.boot--prep { opacity: 0.99; }
      #boot.boot--out { opacity: 0; visibility: hidden; pointer-events: none; }
      /* The APK's launch screen is native (BootOverlay in MainActivity), drawn
         over the WebView so its animation never waits on the page. While it is
         up, boot-sky.js sets data-native-boot and #boot stays only as a plain
         cover: it keeps the app's launch staging (App.jsx) and keeps the app
         under it from being drawn before the prep step, but shows nothing of
         its own, and goes at once when the native screen starts to fade. */
      :root[data-native-boot] #boot > * { display: none; }
      :root[data-native-boot] #boot { transition: none; }

      /* The stage: five slides stacked in one box (the logo, rain, storm,
         snow, sun), each popping in for a 0.7s turn and shrinking away as the
         next pops in over it. The order is random: public/boot-cycle.js plays
         a shuffled sequence on every showing. What is here is its fallback, a
         fixed order on a 3.5s loop: one keyframe track shared by the slides,
         offset by a delay each, with every slide holding the track's hidden
         first frame until its first turn (fill: backwards).
         Scoped to .boot-stage rather than #boot because the app reuses it: a
         copy of this stage is the phone's forecast loading animation (see
         utils/bootStage.js and LoadingScreen.jsx), so these rules have to
         reach it after #boot is gone. Only the boot screen's own chrome (its
         name, its sky, its exit) stays under #boot. */
      .boot-stage {
        position: relative; width: 160px; height: 160px;
        transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .boot-stage .boot-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
      .boot-stage .boot-slide {
        position: absolute; inset: 0;
        animation: boot-slide 3.5s linear infinite backwards;
        will-change: transform, opacity;
      }
      .boot-stage .boot-slide--rain  { animation-delay: 0.7s; }
      .boot-stage .boot-slide--storm { animation-delay: 1.4s; }
      .boot-stage .boot-slide--snow  { animation-delay: 2.1s; }
      .boot-stage .boot-slide--sun   { animation-delay: 2.8s; }
      /* The glyphs fill more of their 32-unit box than the logo does of its
         512, so they sit a little in from the edge to read the same size. */
      .boot-stage .boot-slide:not(.boot-slide--logo) { inset: 5%; }

      /* Every moving part is its own <svg> box rather than a group inside one,
         so the compositor runs its animation and it stays smooth while the JS
         bundle is parsing; will-change keeps each on its layer for the whole
         launch, so nothing is re-rendered mid-motion (the logo's sun glow is a
         blur filter, not cheap to redraw). */
      .boot-stage svg:not(.boot-defs) { position: absolute; overflow: visible; will-change: transform; }

      /* The logo, from its 512-unit artwork: the sun is centred at (197, 197)
         and its layers span 37..357 (7.227% / 62.5%), so their own centre, the
         default transform origin, is the sun's centre. */
      .boot-stage .boot-rays, .boot-stage .boot-core { left: 7.227%; top: 7.227%; width: 62.5%; height: 62.5%; }
      .boot-stage .boot-cloud { inset: 0; width: 100%; height: 100%; }
      .boot-stage .boot-rays { animation: boot-spin 10s linear infinite; }
      .boot-stage .boot-core { animation: boot-breathe 2.8s ease-in-out infinite; }
      .boot-stage .boot-cloud { animation: boot-drift 3.6s ease-in-out infinite alternate; }

      /* The weather glyphs: every layer spans the slide in the glyph's own
         viewBox, so the parts stay registered. The sun's layers use a viewBox
         centred on its disc, which makes the disc their transform origin. */
      .boot-stage .bl { inset: 0; width: 100%; height: 100%; }
      .boot-stage .bl-cloud { animation: boot-drift 3.6s ease-in-out infinite alternate; }
      .boot-stage .bl-rays { animation: boot-spin 10s linear infinite; }
      .boot-stage .bl-core { animation: boot-breathe 2.8s ease-in-out infinite; }
      /* Drops fall on their own, the way the app's icons do: each its own fall
         time and phase (from the app's scatter table), so they never march in
         step. Negative delays start them mid-fall. A storm falls faster. */
      .boot-stage .bl-drop { animation: boot-drop var(--fall) linear var(--lag) infinite; }
      .boot-stage .boot-slide--rain .bl-d1 { --fall: 1.35s; --lag: 0s; }
      .boot-stage .boot-slide--rain .bl-d2 { --fall: 1.54s; --lag: -0.5s; }
      .boot-stage .boot-slide--rain .bl-d3 { --fall: 1.22s; --lag: -0.92s; }
      .boot-stage .boot-slide--storm .bl-d1 { --fall: 0.78s; --lag: 0s; }
      .boot-stage .boot-slide--storm .bl-d2 { --fall: 0.89s; --lag: -0.29s; }
      .boot-stage .boot-slide--storm .bl-d3 { --fall: 0.7s; --lag: -0.53s; }
      .boot-stage .boot-slide--storm .bl-d4 { --fall: 0.83s; --lag: -0.15s; }
      /* Lightning: two quick strikes, then a hold. */
      .boot-stage .bl-bolt { animation: boot-bolt 0.7s linear infinite; }
      /* Two flakes drifting down, out of step. */
      .boot-stage .bl-flake { animation: boot-flake var(--fall) ease-in-out var(--lag) infinite; }
      .boot-stage .bl-f1 { --fall: 1.5s; --lag: -0.3s; }
      .boot-stage .bl-f2 { --fall: 1.8s; --lag: -1.1s; }

      #boot .boot-name {
        position: relative;
        margin: 22px 0 0; font-size: 24px; font-weight: 500; letter-spacing: -0.01em;
        animation: boot-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.12s backwards;
      }
      /* On the way out the stage swells a touch as the screen fades. */
      #boot.boot--out .boot-stage { transform: scale(1.08); }

      /* Per 3.5s loop (0.7s a scene; 1% is 35ms): pop in from small, one
         slight overshoot built into the curve and settled by 0.21s, hold,
         then shrink and fade away (0.6s to 0.74s) as the next scene pops in.
         Scale and opacity only: no turn, no wobble. */
      @keyframes boot-slide {
        0%   { opacity: 0; transform: scale(0.4); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
        6%   { opacity: 1; transform: scale(1); }
        17%  { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
        21%  { opacity: 0; transform: scale(0.6); }
        100% { opacity: 0; transform: scale(0.6); }
      }
      @keyframes boot-slide-fade {
        0%   { opacity: 0; }
        6%   { opacity: 1; }
        17%  { opacity: 1; }
        21%  { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(8px); } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-breathe { 50% { transform: scale(1.06); } }
      @keyframes boot-drift { from { transform: translateX(-3%); } to { transform: translate(3%, -1.5%); } }
      @keyframes boot-drop {
        0%   { opacity: 0; transform: translateY(-6%); }
        20%  { opacity: 1; }
        55%  { opacity: 1; }
        100% { opacity: 0; transform: translateY(16%); }
      }
      @keyframes boot-flake {
        0%   { opacity: 0; transform: translate(0, -10%); }
        25%  { opacity: 1; }
        50%  { transform: translate(3.5%, 4%); }
        75%  { opacity: 1; }
        100% { opacity: 0; transform: translate(-2%, 18%); }
      }
      @keyframes boot-bolt {
        0%, 30%, 38%, 46%, 100% { opacity: 1; }
        34%, 42%                { opacity: 0.15; }
      }
      @keyframes boot-fade { from { opacity: 0; } }

      /* Reduced motion: nothing pops, turns, falls or drifts. The slides still
         take their turns, as plain cross-fades, so a slow launch reads as
         working rather than frozen. */
      @media (prefers-reduced-motion: reduce) {
        .boot-stage .boot-slide { animation-name: boot-slide-fade; }
        #boot .boot-name { animation-name: boot-fade; }
        .boot-stage .boot-slide svg { animation: none; }
        #boot.boot--out .boot-stage { transform: none; }
      }
    </style>
    <script vite-ignore src="boot-sky.js"></script>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Alek Weather">
      <!-- The stage: the logo, then the weather it can bring, each popping in
           for a beat in turn (see .boot-slide). The weather icons are the
           app's own colour glyphs (weatherGlyphs.jsx, ids prefixed b*-), with
           every moving part (each drop, the bolt, each flake, the rays, the
           cloud) on a layer of its own so the compositor can move it. -->
      <div class="boot-stage" aria-hidden="true">

        <div class="boot-slide boot-slide--logo">
          <svg class="boot-rays" viewBox="-160 -160 320 320" focusable="false">
            <g fill="#FFAB00">
              <rect x="-11" y="-152" width="22" height="48" rx="11"/>
              <rect x="-11" y="-152" width="22" height="48" rx="11" transform="rotate(45)"/>
              <rect x="-11" y="-152" width="22" height="48" rx="11" transform="rotate(90)"/>
              <rect x="-11" y="-152" width="22" height="48" rx="11" transform="rotate(135)"/>
              <rect x="-11" y="-152" width="22" height="48" rx="11" transform="rotate(180)"/>
              <rect x="-11" y="-152" width="22" height="48" rx="11" transform="rotate(225)"/>
              <rect x="-11" y="-152" width="22" height="48" rx="11" transform="rotate(270)"/>
              <rect x="-11" y="-152" width="22" height="48" rx="11" transform="rotate(315)"/>
            </g>
          </svg>
          <svg class="boot-core" viewBox="-160 -160 320 320" focusable="false">

              <radialGradient id="boot-sun-fill" cx="38%" cy="38%" r="62%">
                <stop offset="0%" stop-color="#FFF9C4"/>

              <filter id="boot-sun-glow" x="-22%" y="-22%" width="144%" height="144%">

            <circle r="90" fill="url(#boot-sun-fill)" filter="url(#boot-sun-glow)"/>
          </svg>
          <!-- The logo's Fluent Emoji cloud, copied from logo-transparent.svg
               with its ids prefixed boot-cloud- so they can't collide with the
               app's own icons while both are on the page. -->
          <svg class="boot-cloud" viewBox="0 0 512 512" focusable="false">
