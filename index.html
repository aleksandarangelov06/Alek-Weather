<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f2f5" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The Google Fonts stylesheet is added from main.jsx, not linked here: a
         <link rel="stylesheet"> in the head blocks first paint on a round trip
         to fonts.googleapis.com, which on a cold phone radio is seconds. -->
    <title>Alek Weather</title>
    <!-- Boot screen (phone only): inline so the very first paint, before the
         JS bundle and App.css arrive, is already the loading screen. Colours
         follow the OS scheme; main.jsx applies a saved Theme choice and removes
         it on desktop; App.jsx fades it out once the app is ready. -->
    <style>
      #boot {
        --boot-bg: #f0f2f5; --boot-text: #1a1a2e;
        --boot-track: rgba(0, 0, 0, 0.07); --boot-fill: #3b82f6;
        position: fixed; inset: 0; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--boot-bg); color: var(--boot-text);
        font-family: 'Google Sans', 'Product Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.35s ease, visibility 0s linear 0.35s;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #boot {
          --boot-bg: #000000; --boot-text: #e6edf3;
          --boot-track: rgba(255, 255, 255, 0.1); --boot-fill: #60a5fa;
        }
      }
      :root[data-theme="dark"] #boot {
        --boot-bg: #000000; --boot-text: #e6edf3;
        --boot-track: rgba(255, 255, 255, 0.1); --boot-fill: #60a5fa;
      }
      /* Desktops (fine pointer that can hover) never show it. */
      @media (hover: hover) and (pointer: fine) { #boot { display: none; } }
      #boot.boot--out { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot .boot-logo { width: 88px; height: 88px; }
      #boot .boot-name { margin: 14px 0 28px; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
      #boot .boot-bar {
        position: relative; width: 96px; height: 3px; border-radius: 2px;
        overflow: hidden; background: var(--boot-track);
      }
      #boot .boot-bar::after {
        content: ''; position: absolute; inset: 0 auto 0 0; width: 40%;
        border-radius: 2px; background: var(--boot-fill);
        animation: boot-slide 1.3s ease-in-out infinite;
      }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot .boot-bar::after { animation-duration: 2.6s; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Alek Weather">
      <img class="boot-logo" src="/logo-transparent.svg" alt="" />
      <p class="boot-name">Alek Weather</p>
      <div class="boot-bar" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
